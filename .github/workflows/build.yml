name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the project version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })[0]
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match VersionPrefix $version in Directory.Build.props"
          }

      - name: Download AnyPS5 dependencies
        shell: pwsh
        run: ./build/download-dependencies.ps1

      - name: Test
        run: dotnet test --project tests/AnyPS5Conversor.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $suffix = if ('${{ github.ref_type }}' -eq 'tag') { '' } else { '-p:VersionSuffix=dev.${{ github.run_number }}' }
          dotnet publish src/AnyPS5Conversor -c Release -o publish $suffix
          $hash = (Get-FileHash publish/AnyPS5-Conversor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AnyPS5-Conversor.exe" | Set-Content publish/AnyPS5-Conversor.exe.sha256 -NoNewline

      - uses: actions/upload-artifact@v5
        with:
          name: AnyPS5-Conversor
          path: |
            publish/AnyPS5-Conversor.exe
            publish/AnyPS5-Conversor.exe.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: AnyPS5-Conversor
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          section() { awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' "$1"; }
          for file in CHANGELOG.md CHANGELOG.en.md; do
            test -n "$(section "$file" | tr -d '[:space:]')" || { echo "$file has no section for $version"; exit 1; }
          done
          { echo "## Português"; section CHANGELOG.md; echo "## English"; section CHANGELOG.en.md; } > notes.md
          sed "s/{anyps5}/$(jq -r .anyps5 build/dependencies.json)/g" build/release-footer.md >> notes.md
          gh release create "$TAG" dist/AnyPS5-Conversor.exe dist/AnyPS5-Conversor.exe.sha256 THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" --title "AnyPS5 Conversor $TAG" --notes-file notes.md

  # A imagem do README mostra sempre a versão publicada: gerada do próprio .exe, em português e inglês.
  screenshots:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: AnyPS5-Conversor
          path: dist

      - name: Update the README screenshots
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./build/update-screenshots.ps1 -Exe dist/AnyPS5-Conversor.exe
          git add docs/screenshot-pt.png docs/screenshot-en.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { 'Screenshots already up to date.'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update screenshots for $env:TAG"
          git push origin HEAD:main

