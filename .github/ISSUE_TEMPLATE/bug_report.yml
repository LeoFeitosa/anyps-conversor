name: Converter bug
description: The interface or the conversion did not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach games, game files, keys or links to them.** Issues with such content are removed.
  - type: checkboxes
    id: legal
    attributes:
      label: Confirmation
      options:
        - label: I only use free homebrew or copies dumped from my own console, and this issue contains no games, game files, keys or links to them.
          required: true
  - type: input
    id: version
    attributes:
      label: Converter version
      description: Shown in the window footer.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows, CPU and GPU
      placeholder: Windows 11 24H2, Ryzen 7 5800X, RTX 4070
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps and error message.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Conversion details
      description: Text from "Show details" or anyps5.log.
      render: text
